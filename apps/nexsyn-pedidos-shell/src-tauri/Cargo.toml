[package]
name = "nexsyn-pedidos-shell"
version = "0.1.0"
description = "Casco Windows do quadro de pedidos. Zero regra de pedido."
authors = ["NexSyn"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nexsyn_pedidos_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
url = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
